[workspace]

[package]
name = "arbitrage-client"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"
anchor-client = "0.29.0"
anchor-lang = "0.29.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bs58 = "0.5"
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
borsh = "0.10"
bincode = "1"
